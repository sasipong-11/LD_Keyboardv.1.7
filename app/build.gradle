apply plugin: 'com.android.application'

// Release signing is read from keystore.properties at the project root (never commit it).
// Expected keys: storeFile, storePassword, keyAlias, keyPassword
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'th.or.nectec.twskeyboard'
    compileSdk 36

    defaultConfig {
        applicationId "th.or.nectec.twskeyboard"
        minSdk 21
        targetSdk 36

        ndk {
            // Only ARM ships to Play. x86_64 prebuilt .so files are not 16 KB page aligned,
            // and x86/x86_64 are only needed for emulators.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets', 'src/main/res/assets']
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    flavorDimensions = ["license"]
    productFlavors {
        free {
            dimension "license"
            versionName "1.6"
            versionCode 160
            buildConfigField "boolean", "LICENSE_ENABLED", "false"
        }
        pro {
            dimension "license"
            // Play rejected th.or.nectec.twskeyboard (already taken), so pro ships under its own ID.
            // Only the app ID changes; namespace and Java packages stay th.or.nectec.twskeyboard.
            applicationId "th.or.nectec.ldkeyboard"
            // Play automatic protection requires minSdk 24+ (upload rejected at 21).
            minSdk 24
            versionName "1.7.1"
            versionCode 171
            buildConfigField "boolean", "LICENSE_ENABLED", "true"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        jniLibs {
            // Store .so files uncompressed and page-aligned (required for 16 KB page size devices).
            useLegacyPackaging false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.readystatesoftware.sqliteasset:sqliteassethelper:2.0.1'
}
